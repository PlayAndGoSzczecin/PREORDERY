<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLAY&GO PREORDERY</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/wBH0Gjsw/Projekt-bez-nazwy-11.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00aaff; --bg: #0d1117; --card: #161b22; --text: #e0e0e0; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; background-size: cover; background-attachment: fixed; background-position: center; position: relative; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); z-index: -1; }
        .container { max-width: 1400px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        nav { text-align: center; padding: 15px 0; font-size: 2rem; font-weight: 800; color: #fff; text-shadow: 0 0 20px var(--primary); letter-spacing: 4px; }
        
        .header-section { text-align: center; background: rgba(0,0,0,0.75); padding: 25px 15px; border-radius: 20px; margin: 10px auto 30px; max-width: 850px; border: 1px solid #444; backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header-section h1 { margin: 0; font-size: 1.8rem; color: #fff; }
        .subtitle { margin-top: 8px; font-size: 0.9rem; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        /* ZMIANA: Mniejszy grid dla mniejszych kafelków */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        
        /* ZMIANA: Zmniejszona wysokość karty i padding */
        .game-card { background: var(--card); border-radius: 18px; overflow: hidden; position: relative; height: 420px; border: 1px solid #333; transition: 0.3s; }
        .game-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8); position: absolute; transition: 0.5s; }
        .card-body { position: relative; z-index: 1; padding: 15px; height: 100%; display: flex; flex-direction: column; box-sizing: border-box; background: linear-gradient(to top, rgba(0,0,0,0.95) 60%, transparent 100%); }
        
        /* ZMIANA: Mniejsza czcionka tytułu */
        .title { font-size: 1.1rem; font-weight: 800; color: #fff; line-height: 1.2; margin-bottom: 5px; text-shadow: 1px 1px 3px #000; }
        
        /* ZMIANA: Mniejsza czcionka opisu */
        .card-description { 
            font-size: 0.85rem; 
            color: #fff; 
            margin: 5px 0; 
            text-align: center; 
            line-height: 1.2; 
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 0 0 8px #ff0000;
            display: -webkit-box; 
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }

        /* ZMIANA: Mniejsza czcionka ceny i przycisku */
        .price { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-top: auto; margin-bottom: 10px; }
        .btn { background: #ff4444; color: #fff; border: none; padding: 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 800; cursor: pointer; text-transform: uppercase; width: 100%; transition: 0.2s; }
        
        .progress-container { width: 100%; background-color: rgba(255,255,255,0.1); border-radius: 10px; margin: 5px 0; height: 6px; position: relative; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff4444, #ff0000); width: 0%; transition: width 0.8s; }
        .progress-text { font-size: 0.65rem; color: #ff4444; margin-bottom: 2px; font-weight: 700; }

        .featured-banner { grid-column: 1 / -1; height: 300px; background-size: cover; background-position: center; border-radius: 22px; position: relative; overflow: hidden; border: 2px solid #ff0000; display: flex; align-items: center; }
        .banner-overlay { background: linear-gradient(to top, rgba(0,0,0,0.9) 10%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.8) 100%); width: 100%; height: 100%; padding: 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-sizing: border-box; }
        .featured-banner .title { font-size: 2.2rem !important; }
        .banner-price { font-size: 2.5rem; font-weight: 800; color: var(--primary); }

        @media (max-width: 768px) {
            .games-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            .featured-banner { height: auto; min-height: 300px; }
            .featured-banner .title { font-size: 1.6rem !important; }
            .game-card { height: 380px; }
            nav { font-size: 1.8rem; }
        }

        footer { text-align: center; padding: 30px 20px; color: #666; font-size: 0.8rem; }
        #visitor-count { color: var(--primary); font-weight: bold; }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
        .modal-content { background: var(--card); margin: 5vh auto; padding: 30px; border-radius: 25px; width: 90%; max-width: 400px; border: 1px solid var(--primary); position: relative; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #1a1f26; color: #fff; box-sizing: border-box; }
        .close-btn { position: absolute; right: 20px; top: 10px; color: #fff; font-size: 35px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <nav>PLAY&GO</nav>
        <div class="header-section">
            <h1>Nadchodzące premiery.</h1>
            <p class="subtitle">Zarezerwuj swoją kopię już teraz!</p>
        </div>
        <div id="loader" style="text-align:center;">Ładowanie ofert...</div>
        <div id="games-grid" class="games-grid"></div>
    </div>

    <div id="resModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="successMessage" style="display:none; background:#28a745; color:white; padding:20px; border-radius:15px; text-align:center;">REZERWACJA ZAPISANA!</div>
            <div id="formContainer">
                <h2 id="modalTitle" style="color:#fff; margin-top:0; font-size:1.2rem;">Rezerwacja</h2>
                <form id="resForm">
                    <input type="hidden" id="gameTitle">
                    <input type="text" id="custName" placeholder="Imię i Nazwisko" required>
                    <input type="tel" id="custPhone" placeholder="Numer telefonu" required>
                    <input type="email" id="custEmail" placeholder="Adres e-mail" required>
                    <p id="captchaQuestion" style="font-size:0.75rem; color:var(--primary); margin:10px 0 5px; font-weight:700;"></p>
                    <input type="number" id="humanVerify" placeholder="Twój wynik" required>
                    <div style="margin: 10px 0; font-size: 0.75rem; color: #bbb; display: flex; align-items: flex-start; gap: 8px;">
                        <input type="checkbox" id="privacyCheck" style="width: 16px; height: 16px; margin:0;" required>
                        <label for="privacyCheck">Zgoda na przetwarzanie danych.</label>
                    </div>
                    <button type="submit" id="submitBtn" class="btn">POTWIERDZAM REZERWACJĘ</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        Dziękujemy! Jesteś naszym <span id="visitor-count">...</span> gościem.
    </footer>

    <script>
        const URL = 'https://script.google.com/macros/s/AKfycbw1r68KDSbcKhTtqihCdc0qIbZX4Wh46Eo9ZGg9K3i1LdH9sKUAp47xH59HswRnfSTZpA/exec';
        
        let correctCaptchaAnswer = 0;
        let modalOpenTime = 0;

        async function loadData() {
            try {
                const res = await fetch(URL);
                const data = await res.json();
                
                if (data.settings) {
                    if (data.settings.TloStronyURL) document.body.style.backgroundImage = `url('${data.settings.TloStronyURL}')`;
                    if (data.settings.Licznik) document.getElementById('visitor-count').innerText = data.settings.Licznik;
                }

                document.getElementById('loader').style.display = 'none';
                const grid = document.getElementById('games-grid');
                grid.innerHTML = '';

                for (let i = 0; i < data.games.length; i++) {
                    const game = data.games[i];
                    const opisGry = game.Opis || "";
                    
                    let dataTekst = "Wkrótce";
                    let countdownTekst = "";
                    if (game.DataPremiery) {
                        const dPremiera = new Date(game.DataPremiery);
                        dataTekst = dPremiera.toLocaleDateString('pl-PL');
                        const teraz = new Date();
                        const diff = Math.ceil((dPremiera - teraz) / (1000 * 60 * 60 * 24));
                        if (diff > 0) countdownTekst = `${diff} dni`;
                        else if (diff === 0) countdownTekst = "Dziś!";
                        else countdownTekst = "Dostępna!";
                    }

                    let zarezerwowane = game.Zajete || 0; 
                    let calyNaklad = game.Limit || (game.Dostepne + zarezerwowane) || 1; 
                    let procent = Math.round((zarezerwowane / calyNaklad) * 100);
                    if (procent === 0 && game.Dostepne > 0) procent = 3;
                    if (procent > 98 && game.Dostepne > 0) procent = 98;

                    if (i === data.games.length - 1) {
                        // Banner wyróżniony (zostaje duży)
                        const banner = document.createElement('div');
                        banner.className = 'featured-banner';
                        banner.style.backgroundImage = `url('${game.OkladkaURL}')`;
                        banner.innerHTML = `
                            <div class="banner-overlay">
                                <span style="background:#ff0000; color:#fff; padding:3px 10px; border-radius:5px; font-size:0.7rem; font-weight:800; margin-bottom:10px;">POLECANE</span>
                                <div class="title">${game.Tytul}</div>
                                <div class="banner-price">${game.Cena} zł</div>
                                <button class="btn" style="max-width:200px" onclick="openModal('${game.Tytul} (${game.Platforma})')">ZAMÓW TERAZ</button>
                            </div>
                        `;
                        grid.appendChild(banner);
                    } 
                    else {
                        const card = document.createElement('div');
                        card.className = 'game-card';
                        let isAvailable = (game.Dostepne > 0);
                        let buttonHtml = isAvailable 
                            ? `<button class="btn" onclick="openModal('${game.Tytul} (${game.Platforma})')">REZERWUJĘ</button>`
                            : `<button class="btn" style="background:#555;" disabled>BRAK</button>`;

                        card.innerHTML = `
                            <img src="${game.OkladkaURL}" class="card-img" onerror="this.src='https://via.placeholder.com/400x600'">
                            <div class="card-body">
                                <span style="background:var(--primary); color:#fff; padding:2px 6px; border-radius:4px; font-size:0.6rem; font-weight:800; align-self:flex-start; margin-bottom:5px;">${game.Platforma}</span>
                                <div class="title">${game.Tytul}</div>
                                <div class="card-description">${opisGry}</div>
                                <div style="font-size:0.7rem; opacity:0.8;">Data: ${dataTekst}</div>
                                <div style="font-size:0.7rem; font-weight:700; margin-bottom:5px; color:var(--primary)">${countdownTekst}</div>
                                <div class="price">${game.Cena} zł</div>
                                
                                <div style="width: 100%; margin-bottom: 10px;">
                                    <div class="progress-text">${procent}% nakładu</div>
                                    <div class="progress-container">
                                        <div class="progress-bar" style="width: ${procent}%"></div>
                                    </div>
                                </div>
                                ${buttonHtml}
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                }
            } catch (e) { document.getElementById('loader').innerText = "Błąd połączenia."; }
        }

        function openModal(t) {
            const n1 = Math.floor(Math.random() * 15) + 5;
            const n2 = Math.floor(Math.random() * 10) + 2;
            correctCaptchaAnswer = n1 + n2;
            document.getElementById('captchaQuestion').innerText = `ANTY-BOT: Ile to jest ${n1} + ${n2}?`;
            document.getElementById('modalTitle').innerText = t;
            document.getElementById('gameTitle').value = t;
            document.getElementById('resModal').style.display = 'block';
            modalOpenTime = Date.now();
        }

        function closeModal() { document.getElementById('resModal').style.display = 'none'; }

        document.getElementById('resForm').onsubmit = async (e) => {
            e.preventDefault();
            const timeSpent = (Date.now() - modalOpenTime) / 1000;
            if (timeSpent < 3) return;
            if (parseInt(document.getElementById('humanVerify').value) !== correctCaptchaAnswer) { alert("Błędny wynik!"); return; }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "CZEKAJ...";
            
            const p = new URLSearchParams({
                tytul: document.getElementById('gameTitle').value,
                imie: document.getElementById('custName').value,
                telefon: document.getElementById('custPhone').value,
                email: document.getElementById('custEmail').value
            });

            try {
                await fetch(URL + '?' + p.toString(), { mode: 'no-cors' });
                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                setTimeout(() => { closeModal(); location.reload(); }, 2500);
            } catch (err) { alert('Błąd.'); btn.disabled = false; }
        };

        loadData();
    </script>
</body>
</html>
